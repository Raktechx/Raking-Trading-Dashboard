name: Raking the Trader - live scan

# Self-chaining: a run lives ~5.5 h, then starts the next one, so the bot runs 24/7 without
# depending on GitHub's unreliable timers (they remain only as a backup).
# One run stays alive for the whole market day and scans every 5 minutes, so the bot
# does not depend on GitHub's 5-minute timer. The timers below only START the day's run;
# extra starts simply wait in the queue and exit at once.
on:
  schedule:
    - cron: "15 3 * * 1-5"        # 08:45 IST - early start (GitHub timers often run late)
    - cron: "40 3 * * 1-5"        # 09:10 IST - main start
    - cron: "10 4 * * 1-5"        # 09:40 IST - backup start
    - cron: "0 5-9 * * 1-5"       # hourly backup starts
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: raking-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt
      - run: pip install -r requirements-scan.txt
      - name: Install headless browser (to keep the dashboard awake)
        continue-on-error: true
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - id: day
        run: echo "day=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
      - name: Reuse today's instrument lists (downloaded once a day)
        uses: actions/cache@v4
        with:
          path: data/cache/instruments_*.json
          key: instruments-${{ steps.day.outputs.day }}
      - name: Scan every 5 minutes until 15:45 IST, send Telegram alerts, save log and live page
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "raking-bot"
          git config user.email "actions@users.noreply.github.com"
          start=$(date +%s)
          python wake_app.py
          last_wake=$(date +%s); woke=""
          while true; do
            dow=$(TZ=Asia/Kolkata date +%u)
            hm=$(TZ=Asia/Kolkata date +%H%M)
            if [ $(( $(date +%s) - start )) -gt 19800 ]; then
              gh workflow run scan.yml --ref main && echo "Handed over to a fresh run."
              break
            fi
            if [ "$dow" -gt 5 ] || [ "$((10#$hm))" -gt 1545 ] || [ "$((10#$hm))" -lt 915 ]; then
              # outside market hours: stay alive (so tomorrow starts on time), wake the dashboard at ~9:05
              if [ "$dow" -le 5 ] && [ "$((10#$hm))" -ge 900 ] && [ "$((10#$hm))" -lt 915 ] && [ "$woke" != "$(date +%F)" ]; then
                python wake_app.py; woke=$(date +%F); last_wake=$(date +%s)
              fi
              sleep 60
              continue
            fi
            python scan_once.py || echo "Scan failed - trying again next cycle."
            if [ $(( $(date +%s) - last_wake )) -gt 3600 ]; then python wake_app.py; last_wake=$(date +%s); fi
            git add -A data docs LIVE.md
            if ! git diff --cached --quiet; then
              git commit -q -m "live update"
              git pull -q --rebase && git push -q || echo "Push failed - will retry next cycle."
            fi
            if [ $(( $(date +%s) - start )) -gt 19800 ]; then
              gh workflow run scan.yml --ref main && echo "Handed over to a fresh run."
              break
            fi
            next=$(( ($(date +%s) / 300 + 1) * 300 + 20 ))  # +20 s: Upstox publishes the closed candle a few seconds late
            while [ $(( next - $(date +%s) )) -gt 45 ]; do
              sleep $(( 60 - $(date +%s) % 60 ))
              python scan_once.py exits || echo "Exit check failed."
              git add -A data
              if ! git diff --cached --quiet; then git commit -q -m "exit update"; git pull -q --rebase && git push -q || echo "Push failed."; fi
            done
            wait_s=$(( next - $(date +%s) )); if [ "$wait_s" -gt 0 ]; then sleep "$wait_s"; fi
          done
