name: Raking the Trader - live scan

on:
  schedule:
    # market hours only (saves GitHub minutes): every 5 min, Mon-Fri, (schedule refreshed 16 Nov)
    # 09:20-15:45 IST = 03:50-10:15 UTC (end-of-day summary after 15:30)
    - cron: "50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0-15/5 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: raking-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt
      - run: pip install -r requirements-scan.txt
      - id: day
        run: echo "day=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
      - name: Reuse today's instrument lists (downloaded once a day)
        uses: actions/cache@v4
        with:
          path: data/cache/instruments_*.json
          key: instruments-${{ steps.day.outputs.day }}
      - name: Scan Nifty / Bank Nifty / Sensex / F&O stocks, send Telegram alerts, rebuild live page
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_once.py
      - name: Save signals, log and live page back to the repo
        run: |
          git config user.name "raking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs LIVE.md
          if ! git diff --cached --quiet; then
            git commit -m "live update"
            git pull --rebase && git push
          fi
