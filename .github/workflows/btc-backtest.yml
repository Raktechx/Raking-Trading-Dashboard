name: BTCUSD backtest
on:
  workflow_dispatch:
    inputs:
      script:
        description: Research script to run
        type: choice
        default: btc_intraday.py
        options:
          - btc_intraday.py
          - btc_research.py
permissions:
  contents: read
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - env:
          SCRIPT: ${{ inputs.script }}
        run: |
          case "$SCRIPT" in
            btc_intraday.py|btc_research.py) python "$SCRIPT" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) echo "unknown script"; exit 1 ;;
          esac
