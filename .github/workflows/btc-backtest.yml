name: BTCUSD backtest
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python btc_research.py | tee -a "$GITHUB_STEP_SUMMARY"
