name: Raking the Trader - live scan

on:
  schedule:
    # every 5 minutes, Mon-Fri, 03:00-10:55 UTC = 08:30-16:25 IST
    # (scans 09:15-15:30 IST, sends the end-of-day summary after 15:30)
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: raking-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan Nifty / Bank Nifty, send Telegram alerts, rebuild live page
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_once.py
      - name: Save signals, log and live page back to the repo
        run: |
          git config user.name "raking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs LIVE.md
          if ! git diff --cached --quiet; then
            git commit -m "live update"
            git pull --rebase && git push
          fi
